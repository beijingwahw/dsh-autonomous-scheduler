# 讯飞星火 Spark — cordis patch（国产模型）
# Key 由 DSH 自动注入请求头：在 Web UI 或环境变量 SPARK_API_KEY 中配置即可，本文件不含任何密钥。
# 用法：将本文件内容合并进 cordis.yml，或经 DSH patch 机制加载。
- name: dsh-autonomous-scheduler
  config:
    strategistModel:
      id: generalv4.0
      endpoint: https://spark-api-open.xf-yun.com/v1
    models:
      - id: generalv4.0
        endpoint: https://spark-api-open.xf-yun.com/v1
        timeout: 60000
        maxConcurrency: 3
        costPerKToken: 0.005
        contextWindow: 8192
        initialCapabilities:
          taskScores:
            general: 0.75
            documentation: 0.7
      - id: generalv3.5
        endpoint: https://spark-api-open.xf-yun.com/v1
        timeout: 45000
        maxConcurrency: 5
        costPerKToken: 0.003
        contextWindow: 8192
        initialCapabilities:
          taskScores:
            general: 0.65
