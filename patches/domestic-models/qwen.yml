# 通义千问 Qwen（阿里云 DashScope） — cordis patch（国产模型）
# Key 由 DSH 自动注入请求头：在 Web UI 或环境变量 DASHSCOPE_API_KEY 中配置即可，本文件不含任何密钥。
# 用法：将本文件内容合并进 cordis.yml，或经 DSH patch 机制加载。
- name: dsh-autonomous-scheduler
  config:
    strategistModel:
      id: qwen-max
      endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
    models:
      - id: qwen-max
        endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
        timeout: 60000
        maxConcurrency: 3
        costPerKToken: 0.02
        contextWindow: 32768
        initialCapabilities:
          taskScores:
            general: 0.85
            analysis: 0.85
            documentation: 0.8
      - id: qwen-plus
        endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
        timeout: 45000
        maxConcurrency: 5
        costPerKToken: 0.004
        contextWindow: 131072
        initialCapabilities:
          taskScores:
            general: 0.75
            documentation: 0.8
            test-generation: 0.7
      - id: qwen-turbo
        endpoint: https://dashscope.aliyuncs.com/compatible-mode/v1
        timeout: 30000
        maxConcurrency: 8
        costPerKToken: 0.001
        contextWindow: 1000000
        initialCapabilities:
          taskScores:
            general: 0.65
