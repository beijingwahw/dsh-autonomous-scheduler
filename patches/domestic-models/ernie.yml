# 百度文心 ERNIE（千帆） — cordis patch（国产模型）
# Key 由 DSH 自动注入请求头：在 Web UI 或环境变量 QIANFAN_API_KEY 中配置即可，本文件不含任何密钥。
# 用法：将本文件内容合并进 cordis.yml，或经 DSH patch 机制加载。
- name: dsh-autonomous-scheduler
  config:
    strategistModel:
      id: ernie-4.0-8k
      endpoint: https://qianfan.baidubce.com/v2
    models:
      - id: ernie-4.0-8k
        endpoint: https://qianfan.baidubce.com/v2
        timeout: 60000
        maxConcurrency: 3
        costPerKToken: 0.017
        contextWindow: 8192
        initialCapabilities:
          taskScores:
            general: 0.8
            documentation: 0.75
      - id: ernie-speed-128k
        endpoint: https://qianfan.baidubce.com/v2
        timeout: 30000
        maxConcurrency: 8
        costPerKToken: 0
        contextWindow: 131072
        initialCapabilities:
          taskScores:
            general: 0.65
