# 商汤日日新 SenseChat — cordis patch（国产模型）
# Key 由 DSH 自动注入请求头：在 Web UI 或环境变量 SENSENOVA_API_KEY 中配置即可，本文件不含任何密钥。
# 用法：将本文件内容合并进 cordis.yml，或经 DSH patch 机制加载。
- name: dsh-autonomous-scheduler
  config:
    strategistModel:
      id: sensechat-5
      endpoint: https://api.sensenova.cn/v1
    models:
      - id: sensechat-5
        endpoint: https://api.sensenova.cn/v1
        timeout: 60000
        maxConcurrency: 3
        costPerKToken: 0.006
        contextWindow: 128000
        initialCapabilities:
          taskScores:
            general: 0.7
            analysis: 0.7
