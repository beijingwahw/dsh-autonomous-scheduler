    sentinel:
      watchCodeChanges: true
      watchErrors: true
      watchPerformance: true
      aggregationWindow: 5
      signalSources: []
    qualityThreshold: 0.7
    maxRetries: 2
    globalTimeout: 300000
    enableProgress: true
    progressPort: 9877
    verbose: true
    experienceStorePath: .scheduler/memory.json
    encryption:
      enabled: false
      algorithm: aes-256-gcm
      fullFileEncryption: true
    sync:
      localNodeId: node-dev-01
      peers: []
    consensus:
      enabled: false
      localNodeId: node-01
      consensusPort: 9880
      electionTimeoutMin: 1500
      electionTimeoutMax: 3000
      heartbeatInterval: 500
      cluster: []
    hotReload:
      enabled: false
      watchDirs:
      - src
      watchExtensions:
      - .ts
      - .tsx
      - .js
      debounceMs: 1000
      buildCommand: pnpm build
      autoRollback: true
    tenants: []
    dataDir: .scheduler
    memoryFastPathThreshold: 0.9
    autonomy:
      enabled: true
      heartbeatMs: 30000
    hostFusion:
      enabled: true
      observeToolResults: true
      governToolCalls: true
      failureEscalationThreshold: 3
