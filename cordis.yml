# cordis patch — dsh-autonomous-scheduler（开箱即用，零手动配置）
# 已封装全部国产模型：deepseek / qwen / zhipu / moonshot / minimax / spark / hunyuan / ernie / sensechat
# 无需填写任何 apiKey：插件经 ctx 获取 DSH 已配置的 LLM 客户端，
# DSH 自动把用户配置的 Key（Web UI / 环境变量）注入请求头。
- name: dsh-autonomous-scheduler
  config:
    strategistModel:
      id: deepseek-v4-pro
      endpoint: https://api.deepseek.com
    models:
      - id: deepseek-v4-pro
        endpoint: https://api.deepseek.com
        timeout: 90000
        maxConcurrency: 3
        costPerKToken: 0.014
        contextWindow: 128000
        initialCapabilities:
          taskScores:
            code-generation: 0.9
            architecture: 0.85
            debugging: 0.85
            refactoring: 0.8
      - id: deepseek-v4-flash
